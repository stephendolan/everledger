[package]
name = "everledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[features]
default = []
parity-seams = []

[dependencies]
regex = "=1.12.2"
signal-hook = "=0.3.18"
clap = { version = "=4.6.7", features = ["string", "derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }
jiff = { version = "=0.2.45", features = ["serde"] }
